<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Senhas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="conteudo">

            <h1>Gerador de senhas</h1>

            <p class="texto">
                Gere uma senha segura e personalizada.
            </p>

            <div class="resultado">
                <input
                    type="text"
                    id="senha"
                    readonly
                    placeholder="Sua senha aparecerá aqui"
                >

                <button id="copiar">
                    Copiar
                </button>
            </div>

            <div class="opcoes">

                <div class="controle">
                    <label for="tamanho">
                        Tamanho da senha:
                    </label>

                    <span id="valor-tamanho">12</span>

                    <input
                        type="range"
                        id="tamanho"
                        min="6"
                        max="20"
                        value="12"
                    >
                </div>

                <label>
                    <input
                        type="checkbox"
                        id="maiusculas"
                        checked
                    >
                    Letras maiúsculas
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="minusculas"
                        checked
                    >
                    Letras minúsculas
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="numeros"
                        checked
                    >
                    Números
                </label>

                <label>
                    <input
                        type="checkbox"
                        id="simbolos"
                        checked
                    >
                    Símbolos
                </label>

            </div>

            <button
                id="gerar"
                class="botao"
            >
                Gerar senha
            </button>

            <p id="mensagem"></p>

        </section>

        <footer>

            <p>Gabriella Bonette</p>
            <p>Professor: Luiz Alessandro</p>
            <p>Colégio Estadual Dom Pedro II</p>

        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
